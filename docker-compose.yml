services:
  postgres:
    image: postgres:16-alpine
    container_name: slotlock_postgres
    environment:
      POSTGRES_USER: slotlock_admin
      POSTGRES_PASSWORD: slotlock_password
      POSTGRES_DB: slotlock_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: slotlock_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
